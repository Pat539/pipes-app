<ul class="menu menu-horizontal bg-base-200 rounded-box my-2">
  @for(route of routes; track route.path) {
    <li>
      <a [routerLink]="route.path" routerLinkActive="text-accent"> <!--con esto router link le asigna el valor del string al text-accnet, si fuera una señal iria entre []-->
        {{route.title}}
      </a>
    </li>
  }
</ul>
